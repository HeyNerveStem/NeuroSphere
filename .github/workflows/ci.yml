name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Backend, scripts & content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - name: Ruff (lint + format)
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
      - name: Validate 3D model
        run: python scripts/model-validation/validate_model.py
      - name: Validate medical content
        run: |
          python scripts/content-validation/validate_content.py
          git diff --exit-code content/ || (echo "::error::content/*.json is out of date — run validate_content.py and commit" && exit 1)
      - name: API tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,tsx,css}" "e2e/**/*.ts"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
