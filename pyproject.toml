# Tooling config for the Python parts of the repo (backend/ and scripts/).
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "assets/source-models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # long strings in data tables; FastAPI Depends() defaults

[tool.ruff.lint.isort]
known-first-party = ["app"]
